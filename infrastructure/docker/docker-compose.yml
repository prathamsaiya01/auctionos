services:
  postgres:
    image: postgres:16-alpine
    container_name: auctionos-postgres
    restart: always
    environment:
      POSTGRES_USER: auctionos
      POSTGRES_PASSWORD: auctionos_secret_password
      POSTGRES_DB: auctionos_db
    ports:
      - "5432:5432"
    volumes:
      - auctionos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctionos -d auctionos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auctionos-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - auctionos_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auctionos_pgdata:
  auctionos_redisdata:
